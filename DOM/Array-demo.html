<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
</head>
<body class="container-fluid" onload="bodyload()">
    <h3>Add New City</h3>
    <div class="input-group w-25">
        <input type="text" id="txtCity" class="form-control" placeholder="New City Name">
        <button onclick="AddClick()" class="btn btn-primary">Add</button>
    </div>
    <div class="mt-3 w-25">
        <label class="fw-bold form-label">Cities List</label>
        <div>
            <div class="mb-2">
                <button onclick="SortAsc()" class="bi bi-sort-alpha-down btn btn-success"></button>
                <button onclick="SortDsc()" class="bi bi-sort-alpha-up btn btn-success"></button>
            </div>
            <select class="form-select" id="lstCities" size="3">

            </select>
            <div class="mt-2">
                <label class="form-label fw-bold" id="lblCount"></label>
            </div>
            <div class="mt-2">
                <button onclick="RemoveClick()" class="btn btn-danger"><span class="bi bi-trash-fill"></span> Remove City</button>
                <button onclick="ClearClick()" class="btn btn-danger"><span class="bi bi-trash-fill"></span> Clear All</button>
            </div>
        </div>
    </div>


    <script src="Array-demo.js"></script>
</body>
</html>
