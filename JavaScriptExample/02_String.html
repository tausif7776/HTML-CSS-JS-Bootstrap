<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">


     <script>
        function VerifyCard() {
            var card = document.getElementById("txtCard").value;
            var pic = document.getElementById("pic");
            if (card.startsWith("4455")) {
                pic.src = "../public/images/a1.jpg";
            }
        }

        function VerifySkype() {
            var skype = document.getElementById("txtSkype").value;
            var skypeError = document.getElementById("skypeError");
            if (skype.endsWith("outlook.com")) {
                skypeError.innerHTML = " ";
            } else {
                skypeError.innerHTML = "Invalid skype Id".fontcolor('red').italics();
            }
        }
     </script>

</head>
<body class="container-fluid">
    <h3>Verify Payment</h3>
    <dl class="w-25">
        <dt>Card Number</dt>
        <dd class="input-group">
            <input onblur="VerifyCard()"  type="text" maxlength="16" id="txtCard" class="form-control"> <img width="90" id="pic" class="input-group-text">
        </dd>

        <dt>Your SkypeId</dt>
        <dd>
            <input onblur="VerifySkype()" type="text" id="txtSkype" class="form-control">
        </dd>
        <dd id="skypeError"></dd>
    </dl>
</body>
</html>
