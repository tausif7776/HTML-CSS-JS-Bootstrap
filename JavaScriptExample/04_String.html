<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        function SetMeter(min, max, value) {
            var status = document.getElementById("status");
            status.min = min;
            status.max = max;
            status.value = value;
        }

        function VerifyPassword() {
            var password = document.getElementById("txtPwd").value;
            var regExp = /(?=.*[A-Z])\w{4,15}/;
            var pwdError = document.getElementById("pwdError");
            if(password.match(regExp)) {
                pwdError.innerHTML = "Strong Password".fontcolor('green').italics();
                SetMeter(1, 100, 100);
            } else {
                // pwdError.innerHTML = "Weak Password 1 upperCase letter required".fontcolor('red').italics();
                if (password.length<4) {
                    pwdError.innerHTML = "Poor Password-min 4 characters required".fontcolor('red');
                    SetMeter(1, 100, 30);
                } else {
                    pwdError.innerHTML = "Weak Password-1 must be uppercase letter".fontcolor('gold');
                    SetMeter(1, 100, 70);
                }
            }
        }
    </script>
    <style>
        meter {
            width: 170px;
        }
    </style>
</head>
<body>
    <dl>
        <dt>Your Password</dt>
        <dd>
            <input type="password" id="txtPwd" onkeyup="VerifyPassword()">
        </dd>
        <dd>
            <meter value="1" id="status" min="1" max="100"></meter>
        </dd>
        <dd id="pwdError"></dd>
    </dl>
</body>
</html>
