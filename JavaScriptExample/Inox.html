<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    
    <script type="text/javascript">
          function BookClick(){
               document.getElementById("lblMovie").innerHTML = document.getElementById("lstMovie").value;
               document.getElementById("lblCinema").innerHTML = document.getElementById("lstCinema").value;
               document.getElementById("lblDate").innerHTML = document.getElementById("lstDate").value;
               document.getElementById("lblTime").innerHTML = document.getElementById("lstTime").value;
               document.getElementById("lblSeats").innerHTML = document.getElementById("lstSeats").value;

               poster = document.getElementById("poster");
               if(document.getElementById("lstMovie").value=="Horrror"){
                poster.src = "../public/images/movie1.jpg";
               } else{
                 poster.src = "../public/images/movie2.jpg";
               }
               document.getElementById("summaryContainer").style.display = "block";
               document.getElementById("btnBooking").style.display = "none";
          }
    </script>
</head>
<body class="container-fluid">
    <button class="btn btn-primary mt-3" id="btnBooking" data-bs-target="#booking" data-bs-toggle="modal">Quick Booking</button>
    <dl clas="w-50 row" style="display: none;" id="summaryContainer">
        <h2>Booking Summary</h2>
        <img  width="30%" height="250" id="poster">

        <dt class="col-3">Movie</dt>
        <dd class="col-9" id="lblMovie"></dd>
        <dt class="col-3">Cinema</dt>
        <dd class="col-9" id="lblCinema"></dd>
        <dt class="col-3">Date</dt>
        <dd class="col-9" id="lblDate"></dd>
        <dt class="col-3">Time</dt>
        <dd class="col-9" id="lblTime"></dd>
        <dt class="col-3">Seats</dt>
        <dd class="col-9" id="lblSeats"></dd>
        <button class="btn btn-link" data-bs-target="#booking" data-bs-toggle="modal">Modify Booking</button>
    </dl>
    <div class="modal fade" id="booking">
          <div class="modal-dialog modal-fullscreen">
              <div class="modal-content">
                   <div class="modal-header">
                      <h3>Quick Booking</h3>
                      <button class="btn-close" data-bs-dismiss="modal"></button>
                   </div>
                   <div class="modal-body">
                    <div class="d-flex justify-content-between">
                            <div>
                                <select class="form-select" id="lstMovie">
                                    <option>Select Movie</option>
                                    <option>Horrror</option>
                                    <option>The Batman</option>
                                </select>
                            </div>
                             <div>
                                <select class="form-select" id="lstCinema">
                                    <option>Select Cinema</option>
                                    <option>GVK one B'Hills</option>
                                    <option>GVK KPHB</option>
                                </select>
                            </div>
                             <div>
                                <select class="form-select" id="lstDate">
                                    <option>Select Date</option>
                                    <option>04 September-Today</option>
                                    <option>05 September-Tommorrow</option>
                                </select>
                            </div>
                             <div>
                                <select class="form-select" id="lstTime">
                                    <option>Select Time</option>
                                    <option>10:30 AM</option>
                                    <option>1:25 PM</option>
                                </select>
                            </div>
                             <div>
                                <select class="form-select" id="lstSeats">
                                    <option>Select Seats</option>
                                    <option>1</option>
                                    <option>2</option>
                                    <option>3</option>
                                </select>
                            </div>
                            <div>
                                <button data-bs-dismiss="modal" onclick="
                                BookClick()" class="btn btn-danger">Book</button>
                            </div>
                    </div>
                   </div>
              </div>
          </div>
    </div>
    <script src="../node_modules/jquery/dist/jquery.js"></script>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
</body>
</html>
