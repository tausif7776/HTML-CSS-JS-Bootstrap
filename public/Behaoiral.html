<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            list-style: none;
            display: flex;
        }
        li::after{
            content: " >> ";
        }
        li:first-child::before{
            content: "";
        }

        input::placeholder{
            color: brown;
        }
        p::selection{
            color: yellow;
            
            text-decoration: underline 2px dotted;
        }
    </style>
</head>
<body>
    <ul>
        <li>Shopping</li>
        <li>Home</li>
        <li>Electronics</li>
        <li>Mobiles</li>
        <li>Realme</li>
        <li>X7 5G</li>
    </ul>
    <hr><hr>
    <br>
    <input type="text" placeholder="Name Required">
    <hr><hr>
    <br>

</body>
</html>
