<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 150px;
            height: 100px;
            border: 1px solid gray;
            padding: 10px;
        }
        .terms+span{
           color: red;
        }
        .terms:checked+span{
            color: green;
        }
        .terms~button{
            display: none;
        }
        .terms:checked~button{
            display: block;
        }
    </style>
</head>
<body>
    <form>
        <div class="container">
           Term Service
        </div>
        <div>
            <input type="checkbox" class="terms"><span>I Accept</span> <br>
            <button>Submit</button>
        </div>
    </form>
    
</body>
</html>
