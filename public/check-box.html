<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            list-style: none;
            border: 1px solid gray;
            padding: 10px ;
            width: 100px;
            height: 50px;
            overflow: auto;
        }
    </style>
</head>
<body>
    <form>
        <dl>
            <dt>Select Course</dt>
            <dd>
                <ul>
                    <li><input type="checkbox" name="Course" checked value="Java">Java</li>
                    <li><input type="checkbox" name="Course"    value=">.NET">.NET</li>
                    <li><input type="checkbox" name="Course" value="Oracle">Oracle</li>
                   <li><input type="checkbox" name="Course" value="MySql">MySql</li>
                </ul>
            </dd>
        </dl>
    </form>
</body>
</html>
